    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=nacos
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=nacos
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=nacos
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=nacos
      - SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD=sentinel:8858
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/cshp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_APPLICATION_NAME=product-service
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      sentinel:
        condition: service_started

  # 后端微服务 - 订单服务
  order-service:
    build:
      context: .
      dockerfile: backend/order-service/Dockerfile
    container_name: order-service
    restart: always
    networks:
      - cshp-network
    ports:
      - "8083:8083"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=nacos
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=nacos
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=nacos
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=nacos
      - SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD=sentinel:8858
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/cshp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_APPLICATION_NAME=order-service
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      sentinel:
        condition: service_started

  # 后端微服务 - 搜索服务
  search-service:
    build:
      context: . 
      dockerfile: backend/search-service/Dockerfile
    container_name: search-service
    restart: always
