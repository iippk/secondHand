  # 前端Vue应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    networks:
      - cshp-network
    ports:
      - "80:80"
      - "3000:3000"
    volumes:
      - frontend-dist:/usr/share/nginx/html
    environment:
      - VITE_API_BASE_URL=http://gateway-service:8080  # ✅ 容器间通信使用服务名
      - VITE_APP_BASE_URL=http://localhost:80           # 对外访问的地址
      - VITE_APP_TITLE=CSHP Shopping Platform
    depends_on:
      - gateway-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
