server:
  port: 8087

spring:
  application:
    name: ai-service2
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    url: jdbc:mysql://localhost:3306/cshp?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cshp.aiservice.entity
  configuration:
    map-underscore-to-camel-case: true

# AI配置

ai:
  qianwen:
    api-key: sk-5138b961676b4903bfda38d6ab7bfdab
    base-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
    model: qwen-turbo
    max-tokens: 2000
    temperature: 0.7

# 日志配置
logging:
  level:
    com.cshp.aiservice: DEBUG